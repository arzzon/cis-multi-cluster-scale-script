apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: svc-1
  name: svc-1
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: svc-1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: svc-1
    spec:
      containers:
      - env:
        - name: service_name
          value: svc-1
        image: quay.io/f5networks/test-nginx:latest
        imagePullPolicy: IfNotPresent
        name: svc-1
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: run-as-anyid
      serviceAccountName: run-as-anyid
      terminationGracePeriodSeconds: 30